<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C00K90 — Digital Cook Book</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Lato:wght@300;400;600;700&display=swap');
  :root {
    --bg:#f0f4f8;--card:#ffffff;--card-soft:#f7fbfc;
    --magenta:#9b1d8a;--magenta-deep:#6e1260;--magenta-light:#c45ab3;--magenta-pale:#f5e6f3;
    --teal:#0d8a8a;--teal-deep:#096060;--teal-light:#3db8b8;--teal-pale:#e0f5f5;
    --text-dark:#1a1a2e;--text-mid:#4a2060;--text-light:#7a6080;
    --border:#d4e8ec;--border-mag:#e0b0d8;--shadow:rgba(13,138,138,0.10);--shadow-card:rgba(155,29,138,0.10);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Lato',sans-serif;background:var(--bg);color:var(--text-dark);min-height:100vh;}
  .auth-screen{position:fixed;inset:0;background:linear-gradient(135deg,var(--magenta-pale),var(--teal-pale));display:flex;align-items:center;justify-content:center;z-index:999;}
  .auth-card{background:white;border-radius:28px;padding:48px 40px;text-align:center;box-shadow:0 24px 80px rgba(155,29,138,0.22);max-width:380px;width:90%;}
  .auth-logo{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;background:linear-gradient(135deg,var(--magenta),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px;}
  .auth-sub{font-size:12px;color:var(--teal-light);letter-spacing:2px;text-transform:uppercase;margin-bottom:32px;}
  .auth-desc{font-size:14px;color:var(--text-light);margin-bottom:28px;line-height:1.6;}
  .btn-google{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:14px 20px;border:1.5px solid var(--border);border-radius:50px;background:white;font-family:'Lato',sans-serif;font-size:15px;font-weight:600;color:var(--text-dark);cursor:pointer;transition:all 0.2s;}
  .btn-google:hover{background:var(--teal-pale);border-color:var(--teal);}
  header{background:var(--card);border-bottom:2px solid transparent;border-image:linear-gradient(90deg,var(--magenta),var(--teal)) 1;padding:0 32px;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px var(--shadow);}
  .header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:20px;height:72px;flex-wrap:wrap;}
  .logo{display:flex;flex-direction:column;gap:2px;flex-shrink:0;cursor:pointer;}
  .logo-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;line-height:1;background:linear-gradient(135deg,var(--magenta),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .logo-sub{font-size:10px;color:var(--teal-light);letter-spacing:2px;text-transform:uppercase;font-weight:300;}
  .search-bar{flex:1;max-width:400px;position:relative;}
  .search-bar input{width:100%;padding:10px 16px 10px 40px;border:1.5px solid var(--border);border-radius:50px;background:var(--card-soft);font-family:'Lato',sans-serif;font-size:14px;color:var(--text-dark);outline:none;transition:all 0.2s;}
  .search-bar input:focus{border-color:var(--teal);background:white;box-shadow:0 0 0 3px rgba(13,138,138,0.12);}
  .search-bar input::placeholder{color:var(--teal-light);}
  .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--teal-light);font-size:15px;}
  .header-nav{display:flex;align-items:center;gap:8px;margin-left:auto;}
  .nav-btn{padding:8px 16px;border-radius:50px;border:1.5px solid var(--border);background:transparent;color:var(--text-mid);font-family:'Lato',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s;white-space:nowrap;}
  .nav-btn:hover{background:var(--teal-pale);border-color:var(--teal-light);color:var(--teal-deep);}
  .nav-btn.active{background:var(--teal-pale);border-color:var(--teal);color:var(--teal-deep);}
  .btn-new{padding:9px 20px;border-radius:50px;border:none;background:linear-gradient(135deg,var(--magenta),var(--teal));color:white;font-family:'Lato',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s;white-space:nowrap;}
  .btn-new:hover{opacity:0.88;transform:translateY(-1px);}
  .user-avatar{width:34px;height:34px;border-radius:50%;border:2px solid var(--teal-light);cursor:pointer;object-fit:cover;}
  .btn-signout{padding:7px 14px;border-radius:50px;border:1.5px solid var(--border-mag);background:transparent;color:var(--magenta);font-family:'Lato',sans-serif;font-size:12px;font-weight:600;cursor:pointer;}
  .filter-bar{max-width:1200px;margin:24px auto 0;padding:0 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .filter-label{font-size:12px;color:var(--text-light);text-transform:uppercase;letter-spacing:1.5px;font-weight:600;margin-right:4px;}
  .filter-chip{padding:6px 16px;border-radius:50px;border:1.5px solid var(--border);background:var(--card);color:var(--text-mid);font-size:13px;font-weight:600;cursor:pointer;transition:all 0.18s;}
  .filter-chip:hover{background:var(--teal-pale);border-color:var(--teal-light);color:var(--teal-deep);}
  .filter-chip.active{background:linear-gradient(135deg,var(--magenta),var(--teal));border-color:transparent;color:white;}
  .sort-row{max-width:1200px;margin:14px auto 0;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .recipe-count{font-size:13px;color:var(--text-light);}
  .sort-row select{padding:6px 12px;border:1.5px solid var(--border);border-radius:50px;background:var(--card);font-family:'Lato',sans-serif;font-size:13px;color:var(--text-mid);cursor:pointer;outline:none;}
  .recipe-grid{max-width:1200px;margin:24px auto 60px;padding:0 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:24px;}
  .recipe-card{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 4px 18px var(--shadow-card);border:1px solid var(--border);cursor:pointer;transition:all 0.25s;position:relative;}
  .recipe-card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(155,29,138,0.18);border-color:var(--border-mag);}
  .card-image-placeholder{width:100%;height:190px;background:linear-gradient(135deg,var(--magenta-pale),var(--teal-pale));display:flex;align-items:center;justify-content:center;font-size:52px;}
  .heart-btn{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.92);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 2px 8px rgba(0,0,0,0.12);transition:all 0.2s;z-index:2;}
  .heart-btn:hover{transform:scale(1.15);}
  .heart-btn.fav{background:var(--magenta);}
  .card-body{padding:16px 18px 20px;}
  .card-category{font-size:10px;text-transform:uppercase;letter-spacing:1.8px;color:var(--teal);font-weight:700;margin-bottom:6px;}
  .card-title{font-family:'Playfair Display',serif;font-size:18px;font-weight:600;color:var(--magenta-deep);line-height:1.3;margin-bottom:8px;}
  .card-desc{font-size:13px;color:var(--text-mid);line-height:1.55;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card-meta{display:flex;align-items:center;gap:12px;font-size:12px;}
  .meta-pill{display:flex;align-items:center;gap:4px;background:var(--teal-pale);padding:3px 10px;border-radius:50px;font-weight:600;color:var(--teal-deep);}
  .empty-state{grid-column:1/-1;text-align:center;padding:80px 20px;}
  .empty-state .empty-icon{font-size:64px;margin-bottom:16px;}
  .empty-state h3{font-family:'Playfair Display',serif;font-size:24px;color:var(--magenta-deep);margin-bottom:10px;}
  .empty-state p{color:var(--text-light);font-size:15px;}
  .loading-state{grid-column:1/-1;text-align:center;padding:80px 20px;}
  .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--magenta);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .modal-overlay{position:fixed;inset:0;background:rgba(26,10,40,0.50);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;backdrop-filter:blur(4px);}
  .modal-overlay.hidden{display:none!important;}
  .recipe-detail{background:var(--card);border-radius:28px;width:100%;max-width:820px;margin:auto;overflow:hidden;box-shadow:0 24px 80px rgba(155,29,138,0.22);animation:slideUp 0.3s ease;}
  @keyframes slideUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
  .detail-hero{padding:36px 40px 28px;border-bottom:1.5px solid var(--border);display:flex;gap:28px;align-items:flex-start;}
  .detail-hero-text{flex:1;}
  .detail-category{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--teal);font-weight:700;margin-bottom:10px;}
  .detail-title{font-family:'Playfair Display',serif;font-size:32px;font-weight:700;color:var(--magenta-deep);line-height:1.2;margin-bottom:16px;}
  .detail-meta-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  .detail-meta-item{display:flex;align-items:center;gap:5px;background:var(--teal-pale);padding:5px 14px;border-radius:50px;font-size:13px;font-weight:600;color:var(--teal-deep);}
  .detail-desc{font-size:15px;color:var(--text-mid);line-height:1.65;font-style:italic;}
  .detail-image-wrap{flex-shrink:0;width:220px;height:190px;border-radius:18px;overflow:hidden;border:2px solid var(--border);background:linear-gradient(135deg,var(--magenta-pale),var(--teal-pale));display:flex;align-items:center;justify-content:center;font-size:56px;}
  .detail-image-wrap img{width:100%;height:100%;object-fit:cover;}
  .detail-actions{display:flex;gap:10px;margin-top:18px;}
  .btn-action{padding:8px 20px;border-radius:50px;border:1.5px solid var(--border);background:transparent;color:var(--text-mid);font-family:'Lato',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s;}
  .btn-action:hover{background:var(--teal-pale);}
  .btn-action.danger{color:#c0392b;border-color:#f0c0c0;}
  .btn-action.danger:hover{background:#fff0f0;}
  .btn-action.primary{background:linear-gradient(135deg,var(--magenta),var(--teal));color:white;border-color:transparent;}
  .detail-body{padding:32px 40px;}
  .section-heading{font-size:11px;text-transform:uppercase;letter-spacing:2.5px;color:var(--magenta);font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px;}
  .section-heading::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border-mag),var(--border));}
  .ingredients-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:32px;}
  .ingredient-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;font-size:14px;color:var(--text-dark);transition:background 0.15s;}
  .ingredient-item:hover{background:var(--teal-pale);}
  .ingredient-dot{width:6px;height:6px;border-radius:50%;background:var(--teal);flex-shrink:0;}
  .ingredient-qty{font-weight:700;color:var(--magenta);min-width:28px;}
  .steps-list{display:flex;flex-direction:column;gap:12px;margin-bottom:32px;}
  .step-item{display:flex;gap:14px;align-items:flex-start;padding:14px 18px;background:var(--card-soft);border-radius:14px;border:1px solid var(--border);}
  .step-item:hover{background:var(--magenta-pale);}
  .step-num{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--magenta),var(--teal));color:white;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;margin-top:1px;}
  .step-text{font-size:14px;color:var(--text-dark);line-height:1.6;padding-top:4px;}
  .notes-box{background:var(--magenta-pale);border:1.5px dashed var(--magenta-light);border-radius:16px;padding:20px;margin-bottom:20px;}
  .notes-title{font-family:'Playfair Display',serif;font-size:15px;font-weight:600;color:var(--magenta-deep);margin-bottom:10px;font-style:italic;}
  .notes-text{font-size:13px;color:var(--text-mid);line-height:1.65;font-style:italic;}
  .notes-empty{color:var(--magenta-light);font-size:13px;font-style:italic;}
  .source-link{font-size:13px;color:var(--teal);text-decoration:none;display:flex;align-items:center;gap:6px;}
  .detail-close{position:absolute;top:18px;right:20px;width:36px;height:36px;border-radius:50%;border:none;background:var(--teal-pale);color:var(--teal-deep);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
  .detail-close:hover{background:var(--magenta);color:white;}
  .form-modal{background:var(--card);border-radius:28px;width:100%;max-width:680px;margin:auto;overflow:hidden;box-shadow:0 24px 80px rgba(155,29,138,0.22);animation:slideUp 0.3s ease;}
  .form-header{padding:28px 36px 20px;border-bottom:1.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .form-title{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:var(--magenta-deep);}
  .form-body{padding:28px 36px;max-height:72vh;overflow-y:auto;}
  .form-body::-webkit-scrollbar{width:5px;}
  .form-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;}
  .form-group{margin-bottom:20px;}
  .form-group label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--teal-deep);margin-bottom:7px;}
  .form-group input,.form-group textarea,.form-group select{width:100%;padding:11px 16px;border:1.5px solid var(--border);border-radius:12px;background:var(--card-soft);font-family:'Lato',sans-serif;font-size:14px;color:var(--text-dark);outline:none;transition:all 0.2s;}
  .form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--teal);background:white;box-shadow:0 0 0 3px rgba(13,138,138,0.12);}
  .form-group textarea{resize:vertical;min-height:80px;line-height:1.55;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .dynamic-list{display:flex;flex-direction:column;gap:8px;}
  .dynamic-item{display:flex;gap:8px;align-items:center;}
  .dynamic-item input{flex:1;}
  .dynamic-item .qty-input{width:70px;flex:none;}
  .dynamic-item .unit-input{width:80px;flex:none;}
  .btn-remove{width:30px;height:30px;border:none;background:var(--teal-pale);color:var(--teal);border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s;}
  .btn-remove:hover{background:#ffcdd2;color:#c0392b;}
  .btn-add-row{padding:8px 16px;border:1.5px dashed var(--teal-light);border-radius:10px;background:transparent;color:var(--teal);font-family:'Lato',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s;margin-top:4px;}
  .btn-add-row:hover{background:var(--teal-pale);border-color:var(--teal);}
  .form-footer{padding:20px 36px 28px;display:flex;gap:12px;justify-content:flex-end;border-top:1.5px solid var(--border);background:var(--card-soft);}
  .btn-cancel{padding:10px 24px;border:1.5px solid var(--border);border-radius:50px;background:transparent;color:var(--text-mid);font-family:'Lato',sans-serif;font-size:14px;font-weight:600;cursor:pointer;}
  .btn-cancel:hover{background:var(--teal-pale);}
  .btn-save{padding:10px 28px;border:none;border-radius:50px;background:linear-gradient(135deg,var(--magenta),var(--teal));color:white;font-family:'Lato',sans-serif;font-size:14px;font-weight:700;cursor:pointer;}
  .btn-save:hover{opacity:0.85;}
  .confirm-dialog{background:var(--card);border-radius:20px;padding:32px;max-width:360px;width:100%;margin:auto;text-align:center;box-shadow:0 20px 60px rgba(155,29,138,0.22);animation:slideUp 0.25s ease;}
  .confirm-dialog .confirm-icon{font-size:40px;margin-bottom:14px;}
  .confirm-dialog h3{font-family:'Playfair Display',serif;color:var(--magenta-deep);font-size:20px;margin-bottom:10px;}
  .confirm-dialog p{font-size:14px;color:var(--text-mid);margin-bottom:22px;line-height:1.55;}
  .confirm-btns{display:flex;gap:12px;justify-content:center;}
  .btn-confirm-delete{padding:10px 22px;border:none;border-radius:50px;background:#c0392b;color:white;font-family:'Lato',sans-serif;font-size:14px;font-weight:700;cursor:pointer;}
  .btn-confirm-cancel{padding:10px 22px;border:1.5px solid var(--border);border-radius:50px;background:transparent;color:var(--text-mid);font-family:'Lato',sans-serif;font-size:14px;font-weight:600;cursor:pointer;}
  .toast{position:fixed;bottom:30px;right:30px;background:linear-gradient(135deg,var(--magenta-deep),var(--teal-deep));color:white;padding:14px 22px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(155,29,138,0.3);z-index:999;animation:fadeInUp 0.3s ease;max-width:300px;}
  .toast.hidden{display:none!important;}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  .image-upload-area{border:2px dashed var(--teal-light);border-radius:14px;padding:20px;text-align:center;cursor:pointer;background:var(--card-soft);transition:all 0.2s;}
  .image-upload-area:hover{background:var(--teal-pale);border-color:var(--teal);}
  .image-upload-area .upload-icon{font-size:30px;margin-bottom:8px;}
  .image-upload-area p{font-size:13px;color:var(--text-light);}
  .image-preview{width:100%;max-height:180px;object-fit:cover;border-radius:12px;margin-top:10px;}
  .tags-input-wrap{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1.5px solid var(--border);border-radius:12px;background:var(--card-soft);min-height:44px;cursor:text;}
  .tag-chip{padding:3px 10px;background:var(--magenta-pale);border-radius:50px;font-size:12px;color:var(--magenta-deep);font-weight:600;display:flex;align-items:center;gap:5px;}
  .tag-chip span{cursor:pointer;color:var(--magenta);}
  .tags-input-wrap input{border:none;background:transparent;outline:none;font-family:'Lato',sans-serif;font-size:14px;color:var(--text-dark);min-width:80px;flex:1;}
  .hidden{display:none!important;}
  .relative{position:relative;}
  @media(max-width:768px){
    header{padding:0 16px;}
    .header-inner{height:auto;padding:12px 0;flex-wrap:wrap;gap:12px;}
    .search-bar{max-width:100%;order:3;width:100%;}
    .header-nav{margin-left:0;}
    .recipe-grid{grid-template-columns:1fr 1fr;gap:16px;padding:0 16px;}
    .detail-hero{flex-direction:column-reverse;padding:24px 20px;}
    .detail-image-wrap{width:100%;height:200px;}
    .detail-body{padding:24px 20px;}
    .ingredients-grid{grid-template-columns:1fr;}
    .form-body{padding:20px;max-height:65vh;}
    .form-header{padding:20px;}
    .form-footer{padding:16px 20px;}
    .form-row,.form-row-3{grid-template-columns:1fr;}
    .filter-bar,.sort-row{padding:0 16px;}
  }
  @media(max-width:480px){
    .recipe-grid{grid-template-columns:1fr;}
    .nav-btn{padding:6px 12px;font-size:12px;}
    .btn-new{padding:8px 14px;font-size:12px;}
  }
</style>
</head>
<body>

<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">C00K90</div>
    <div class="auth-desc">Your personal digital cookbook. Sign in to access your recipes from any device.</div>
    <button class="btn-google" id="googleSignInBtn">
      <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Sign in with Google
    </button>
  </div>
</div>

<header>
  <div class="header-inner">
    <div class="logo" id="logoBtn"><div class="logo-title">C00K90</div></div>
    <div class="search-bar"><span class="search-icon">🔍</span><input type="text" id="searchInput" placeholder="Search recipes or ingredients…"></div>
    <div class="header-nav">
      <button class="nav-btn active" id="navHome">Home</button>

<script>
firebase.initializeApp({

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(window._tt); window._tt = setTimeout(() => t.classList.add('hidden'), 2800);
}

function diffIcon(d) { return d==='Easy'?'🟢':d==='Medium'?'🟡':'🔴'; }
function getCatEmoji(c) { return {'Cakes':'🎂','Cupcakes':'🧁','Cookies':'🍪','Bread':'🍞','Breakfast':'🍳','Desserts':'🍮','Main dishes':'🍽️','Pasta':'🍝','Soups':'🍲','Salads':'🥗','Drinks':'🥤','Other':'✨'}[c]||'🍽️'; }

// AUTH
document.getElementById('googleSignInBtn').addEventListener('click', () => {
  auth.signInWithPopup(provider).catch(() => showToast('⚠️ Sign in failed'));
});
document.getElementById('signOutBtn').addEventListener('click', () => {
  auth.signOut();
});

auth.onAuthStateChanged(async user => {
  if (user) {
    currentUser = user;
    document.getElementById('authScreen').classList.add('hidden');
    if (user.photoURL) {
      document.getElementById('userAvatar').src = user.photoURL;
      document.getElementById('userAvatar').classList.remove('hidden');
    }
    document.getElementById('signOutBtn').classList.remove('hidden');
    await loadRecipes();
  } else {
    currentUser = null;
    allRecipes = [];

    document.getElementById('userAvatar').classList.add('hidden');
    document.getElementById('signOutBtn').classList.add('hidden');

});

// FIRESTORE
async function loadRecipes() {
  if (!currentUser) return;
  document.getElementById('recipeGrid').innerHTML = '<div class="loading-state"><div class="spinner"></div><p style="color:var(--text-light)">Loading your recipes…</p></div>';
  try {
    const snap = await db.collection('recipes').where('userId','==',currentUser.uid).get();
    allRecipes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    allRecipes.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
    renderGrid();
  } catch(e) { showToast('⚠️ Error loading recipes'); }
}

// RENDER
function getFiltered() {
  let r = [...allRecipes];
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  if (currentView === 'favorites') r = r.filter(x => x.favorite);
  if (currentCategory !== 'all') r = r.filter(x => x.category === currentCategory);
  if (q) r = r.filter(x => {
    const ing = (x.ingredients||[]).map(i=>i.name+' '+i.qty+' '+i.unit).join(' ').toLowerCase();
    const tags = (x.tags||[]).join(' ').toLowerCase();
    return x.name.toLowerCase().includes(q)||(x.description||'').toLowerCase().includes(q)||ing.includes(q)||tags.includes(q)||x.category.toLowerCase().includes(q);
  });
  const sort = document.getElementById('sortSelect').value;
  if (sort==='alpha') r.sort((a,b)=>a.name.localeCompare(b.name));
  else if (sort==='time') r.sort((a,b)=>((a.prepTime||0)+(a.cookTime||0))-((b.prepTime||0)+(b.cookTime||0)));
  else r.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  return r;
}

function renderGrid() {
  const grid = document.getElementById('recipeGrid');
  const recipes = getFiltered();
  document.getElementById('recipeCount').textContent = `${recipes.length} recipe${recipes.length!==1?'s':''}`;
  if (!recipes.length) {
    const q = document.getElementById('searchInput').value;
    grid.innerHTML = `<div class="empty-state"><div class="empty-icon">${q?'🔍':'🍽️'}</div><h3>${q?'No recipes found.':(currentView==='favorites'?'No favorites yet.':'Your cookbook is empty!')}</h3><p>${q?'Try another ingredient or recipe name.':(currentView==='favorites'?'Click the ♡ on a recipe to save it here.':'Click "+ New Recipe" to add your first recipe!')}</p></div>`;
    return;
  }
  grid.innerHTML = recipes.map(r => {
    const total = (r.prepTime||0)+(r.cookTime||0);
    return `<div class="recipe-card" data-id="${r.id}">
      <div class="relative">
        ${r.imageData?`<img src="${r.imageData}" alt="${r.name}" style="width:100%;height:190px;object-fit:cover;">`:`<div class="card-image-placeholder">${r.imageEmoji||'🍽️'}</div>`}
        <button class="heart-btn ${r.favorite?'fav':''}" data-fav="${r.id}">${r.favorite?'❤️':'🤍'}</button>
      </div>
      <div class="card-body">
        <div class="card-category">${r.category}</div>
        <div class="card-title">${r.name}</div>
        <div class="card-desc">${r.description||'A delicious recipe waiting to be explored.'}</div>
        <div class="card-meta">
          ${total?`<span class="meta-pill">⏱ ${total} min</span>`:''}
          <span class="meta-pill">${diffIcon(r.difficulty)} ${r.difficulty||'Easy'}</span>
        </div>
      </div>
    </div>`;
  }).join('');

  document.querySelectorAll('.recipe-card').forEach(card => {
    card.addEventListener('click', e => { if (!e.target.closest('.heart-btn')) openDetail(card.dataset.id); });
  });
  document.querySelectorAll('.heart-btn').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); toggleFav(btn.dataset.fav); });
  });
}

// NAV
document.getElementById('navHome').addEventListener('click', () => {
  currentView='all'; currentCategory='all';
  document.getElementById('searchInput').value='';
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
  document.querySelector('.filter-chip[data-cat="all"]').classList.add('active');
  document.getElementById('navHome').classList.add('active');
  document.getElementById('navFav').classList.remove('active');
  renderGrid();
});
document.getElementById('navFav').addEventListener('click', () => {
  currentView='favorites'; currentCategory='all';
  document.getElementById('searchInput').value='';
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
  document.querySelector('.filter-chip[data-cat="all"]').classList.add('active');
  document.getElementById('navHome').classList.remove('active');
  document.getElementById('navFav').classList.add('active');
  renderGrid();
});
document.getElementById('logoBtn').addEventListener('click', () => document.getElementById('navHome').click());
document.getElementById('searchInput').addEventListener('input', renderGrid);
document.getElementById('sortSelect').addEventListener('change', renderGrid);
document.querySelectorAll('.filter-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    currentCategory = chip.dataset.cat; currentView='all';
    document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    document.getElementById('navHome').classList.add('active');
    document.getElementById('navFav').classList.remove('active');
    renderGrid();
  });
});

// FAVORITES
async function toggleFav(id) {
  const r = allRecipes.find(x=>x.id===id); if(!r) return;
  r.favorite = !r.favorite;
  await db.collection('recipes').doc(id).update({favorite: r.favorite});
  renderGrid();
  showToast(r.favorite?'❤️ Added to favorites!':'🤍 Removed from favorites');
}

// DETAIL
function openDetail(id) {
  const r = allRecipes.find(x=>x.id===id); if(!r) return;
  const total=(r.prepTime||0)+(r.cookTime||0);
  document.getElementById('detailHero').innerHTML=`
    <div class="detail-hero-text">
      <div class="detail-category">${r.category}</div>
      <div class="detail-title">${r.name}</div>
      <div class="detail-meta-row">
        ${r.prepTime?`<span class="detail-meta-item">🥄 Prep: ${r.prepTime} min</span>`:''}
        ${r.cookTime?`<span class="detail-meta-item">🔥 Cook: ${r.cookTime} min</span>`:''}
        ${total?`<span class="detail-meta-item">⏱ Total: ${total} min</span>`:''}
        <span class="detail-meta-item">${diffIcon(r.difficulty)} ${r.difficulty||'Easy'}</span>
        ${r.servings?`<span class="detail-meta-item">🍽 Serves ${r.servings}</span>`:''}
      </div>
      ${r.description?`<div class="detail-desc">${r.description}</div>`:''}
      <div class="detail-actions">
        <button class="btn-action primary" id="favDetailBtn">${r.favorite?'❤️ Favorited':'♡ Favorite'}</button>
        <button class="btn-action" id="editDetailBtn">✏️ Edit</button>
        <button class="btn-action danger" id="deleteDetailBtn">🗑 Delete</button>
      </div>
    </div>
    <div class="detail-image-wrap">
      ${r.imageData?`<img src="${r.imageData}" alt="${r.name}">`:`<span style="font-size:56px">${r.imageEmoji||'🍽️'}</span>`}
    </div>`;

  document.getElementById('favDetailBtn').addEventListener('click', async () => {
    r.favorite=!r.favorite;
    await db.collection('recipes').doc(id).update({favorite:r.favorite});
    document.getElementById('favDetailBtn').textContent=r.favorite?'❤️ Favorited':'♡ Favorite';
    renderGrid(); showToast(r.favorite?'❤️ Added to favorites!':'🤍 Removed from favorites');
  });
  document.getElementById('editDetailBtn').addEventListener('click', () => { closeDetail(); openEditRecipe(id); });
  document.getElementById('deleteDetailBtn').addEventListener('click', () => confirmDelete(id));

  const ingCols=(r.ingredients||[]).reduce((acc,ing,i)=>{
    const t=`<div class="ingredient-item"><span class="ingredient-dot"></span><span class="ingredient-qty">${ing.qty||''}</span><span style="color:var(--text-light);font-size:12px;margin-right:4px">${ing.unit||''}</span><span>${ing.name}</span></div>`;
    acc[i%2===0?'left':'right'].push(t); return acc;
  },{left:[],right:[]});
  const stepsHTML=(r.steps||[]).map((s,i)=>`<div class="step-item"><div class="step-num">${i+1}</div><div class="step-text">${s}</div></div>`).join('');
  const tagsHTML=r.tags&&r.tags.length?`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px">${r.tags.map(t=>`<span class="tag-chip">#${t}</span>`).join('')}</div>`:'';
  document.getElementById('detailBody').innerHTML=`
    <div class="section-heading">Ingredients</div>
    <div class="ingredients-grid"><div>${ingCols.left.join('')}</div><div>${ingCols.right.join('')}</div></div>
    <div class="section-heading">Steps</div>
    <div class="steps-list">${stepsHTML}</div>
    ${tagsHTML}
    <div class="section-heading">My Notes</div>
    <div class="notes-box">
      <div class="notes-title">✍️ My Notes </div>
      ${r.notes?`<div class="notes-text">${r.notes}</div>`:`<div class="notes-empty">No notes yet!</div>`}
    </div>
    ${r.source?`<a href="${r.source}" target="_blank" rel="noopener" class="source-link">🔗 ${r.source}</a>`:''}`;
  document.getElementById('detailOverlay').classList.remove('hidden');
  document.body.style.overflow='hidden';
}

function closeDetail() { document.getElementById('detailOverlay').classList.add('hidden'); document.body.style.overflow=''; }
document.getElementById('closeDetailBtn').addEventListener('click', closeDetail);
document.getElementById('detailOverlay').addEventListener('click', e => { if(e.target===document.getElementById('detailOverlay')) closeDetail(); });

// FORM
document.getElementById('newRecipeBtn').addEventListener('click', () => openNewRecipe());
document.getElementById('closeFormBtn').addEventListener('click', closeForm);
document.getElementById('cancelFormBtn').addEventListener('click', closeForm);
document.getElementById('saveRecipeBtn').addEventListener('click', saveRecipe);

  reader.readAsDataURL(file);

  editingRecipeId=null;
  document.getElementById('formTitle').textContent='New Recipe ✨';
  document.getElementById('editingId').value='';
  clearForm();
  document.getElementById('formOverlay').classList.remove('hidden');

}
function openEditRecipe(id) {
  const r=allRecipes.find(x=>x.id===id); if(!r) return;
  editingRecipeId=id;
  document.getElementById('formTitle').textContent='Edit Recipe ✏️';
  document.getElementById('editingId').value=id;
  document.getElementById('fName').value=r.name||'';
  document.getElementById('fDesc').value=r.description||'';
  document.getElementById('fCategory').value=r.category||'';
  document.getElementById('fDiff').value=r.difficulty||'Easy';
  document.getElementById('fPrep').value=r.prepTime||'';
  document.getElementById('fCook').value=r.cookTime||'';
  document.getElementById('fServ').value=r.servings||'';
  document.getElementById('fSource').value=r.source||'';
  document.getElementById('fNotes').value=r.notes||'';
  document.getElementById('fImageData').value=r.imageData||'';
  if(r.imageData){document.getElementById('fImagePreview').src=r.imageData;document.getElementById('fImagePreview').classList.remove('hidden');}
  document.getElementById('ingredientsList').innerHTML='';
  (r.ingredients||[]).forEach(ing=>addIngredient(ing.qty,ing.unit,ing.name));
  if(!(r.ingredients||[]).length) addIngredient();
  document.getElementById('stepsList').innerHTML='';
  (r.steps||[]).forEach(s=>addStep(s));
  if(!(r.steps||[]).length) addStep();
  currentTags=[...(r.tags||[])]; renderTags();
  document.getElementById('formOverlay').classList.remove('hidden');
  document.body.style.overflow='hidden';
}
function clearForm() {
  ['fName','fDesc','fSource','fNotes','fPrep','fCook','fServ'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fCategory').value=''; document.getElementById('fDiff').value='Easy';
  document.getElementById('fImageData').value=''; document.getElementById('fImagePreview').src='';
  document.getElementById('fImagePreview').classList.add('hidden');
  document.getElementById('ingredientsList').innerHTML=''; document.getElementById('stepsList').innerHTML='';
  currentTags=[]; renderTags();
}
function closeForm() { document.getElementById('formOverlay').classList.add('hidden'); document.body.style.overflow=''; }

function addIngredient(qty='',unit='',name='') {
  const list=document.getElementById('ingredientsList');
  const div=document.createElement('div'); div.className='dynamic-item';
  div.innerHTML=`<input class="qty-input" type="text" placeholder="Qty" value="${qty}"><input class="unit-input" type="text" placeholder="Unit" value="${unit}"><input type="text" placeholder="Ingredient name" value="${name}"><button class="btn-remove">✕</button>`;
  div.querySelector('.btn-remove').addEventListener('click', () => div.remove());
  list.appendChild(div);
}
function addStep(text='') {
  const list=document.getElementById('stepsList'); const n=list.children.length+1;
  const div=document.createElement('div'); div.className='dynamic-item';
  div.innerHTML=`<div class="step-num" style="flex-shrink:0">${n}</div><input type="text" placeholder="Describe step ${n}…" value="${text.replace(/"/g,'&quot;')}"><button class="btn-remove">✕</button>`;
  div.querySelector('.btn-remove').addEventListener('click', () => { div.remove(); document.querySelectorAll('#stepsList .step-num').forEach((el,i)=>el.textContent=i+1); });
  list.appendChild(div);
}
function renderTags() {
  const wrap=document.getElementById('tagsWrap'); const input=document.getElementById('tagInput');
  wrap.innerHTML='';
  currentTags.forEach((t,i)=>{
    const chip=document.createElement('div'); chip.className='tag-chip';
    chip.innerHTML=`${t} <span>✕</span>`;
    chip.querySelector('span').addEventListener('click', ()=>{currentTags.splice(i,1);renderTags();});
    wrap.appendChild(chip);
  });
  wrap.appendChild(input);
}

async function saveRecipe() {
  const name=document.getElementById('fName').value.trim();
  const category=document.getElementById('fCategory').value;
  if(!name){showToast('⚠️ Please enter a recipe name!');return;}
  if(!category){showToast('⚠️ Please select a category!');return;}
  const ingredients=Array.from(document.querySelectorAll('#ingredientsList .dynamic-item')).map(row=>{const inputs=row.querySelectorAll('input');return{qty:inputs[0].value.trim(),unit:inputs[1].value.trim(),name:inputs[2].value.trim()};}).filter(i=>i.name);
  const steps=Array.from(document.querySelectorAll('#stepsList .dynamic-item input')).map(i=>i.value.trim()).filter(Boolean);
  const tagInput=document.getElementById('tagInput').value.trim();
  if(tagInput) currentTags.push(tagInput);
  const recipe={name,description:document.getElementById('fDesc').value.trim(),category,difficulty:document.getElementById('fDiff').value,prepTime:parseInt(document.getElementById('fPrep').value)||0,cookTime:parseInt(document.getElementById('fCook').value)||0,servings:parseInt(document.getElementById('fServ').value)||0,imageData:document.getElementById('fImageData').value,imageEmoji:getCatEmoji(category),ingredients,steps,tags:[...currentTags],source:document.getElementById('fSource').value.trim(),notes:document.getElementById('fNotes').value.trim(),userId:currentUser.uid,createdAt:Date.now()};
  try {
    if(editingRecipeId){
      const existing=allRecipes.find(r=>r.id===editingRecipeId);
      recipe.favorite=existing?existing.favorite:false;
      recipe.createdAt=existing?existing.createdAt:Date.now();
      await db.collection('recipes').doc(editingRecipeId).update(recipe);
      const idx=allRecipes.findIndex(r=>r.id===editingRecipeId);
      if(idx>-1) allRecipes[idx]={id:editingRecipeId,...recipe};
    } else {
      recipe.favorite=false;
      const ref=await db.collection('recipes').add(recipe);
      allRecipes.unshift({id:ref.id,...recipe});
    }
    closeForm(); renderGrid();
    showToast(editingRecipeId?'✅ Recipe updated!':'🎉 Recipe saved!');
  } catch(e){showToast('⚠️ Error saving recipe: '+e.message);}
}

// DELETE
function confirmDelete(id) {
  deleteTargetId=id;
  document.getElementById('confirmOverlay').classList.remove('hidden');
}
document.getElementById('cancelDeleteBtn').addEventListener('click', () => { document.getElementById('confirmOverlay').classList.add('hidden'); deleteTargetId=null; });
document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
  try {
    await db.collection('recipes').doc(deleteTargetId).delete();
    allRecipes=allRecipes.filter(r=>r.id!==deleteTargetId);
    document.getElementById('confirmOverlay').classList.add('hidden');
    closeDetail(); renderGrid();
    showToast('🗑️ Recipe deleted');
  } catch(e){showToast('⚠️ Error deleting recipe');}
});
</script>

document.getElementById("addPastedStepsBtn").addEventListener("click", () => {

    .map(l => l.trim())
    .map(l => l.replace(/^\d+[\.\)]\s*/, ""))
    .map(l => l.replace(/^[-•*]\s*/, ""))
