# Builds the Angular app in frontend/ and uploads it to cookbook.antdevlabs.com (cPanel) over FTPS.
# The old app in the repo root is still deployed by GitHub Pages and is not touched by this workflow.
name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Generates src/environments/firebase.config.ts (gitignored) from the repository secrets.
      - run: npm run firebase-config
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          AI_FIREBASE_API_KEY: ${{ secrets.AI_FIREBASE_API_KEY }}
          AI_FIREBASE_AUTH_DOMAIN: ${{ secrets.AI_FIREBASE_AUTH_DOMAIN }}
          AI_FIREBASE_PROJECT_ID: ${{ secrets.AI_FIREBASE_PROJECT_ID }}
          AI_FIREBASE_STORAGE_BUCKET: ${{ secrets.AI_FIREBASE_STORAGE_BUCKET }}
          AI_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.AI_FIREBASE_MESSAGING_SENDER_ID }}
          AI_FIREBASE_APP_ID: ${{ secrets.AI_FIREBASE_APP_ID }}
          AI_RECAPTCHA_SITE_KEY: ${{ secrets.AI_RECAPTCHA_SITE_KEY }}

      - run: npx ng test --watch=false
      - run: npx ng build

      # Uploads only files that changed since the last deploy, and removes files that are no longer in the build.
      - uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: frontend/dist/c00k90/browser/
          server-dir: ./
