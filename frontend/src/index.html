<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>C00K90 — Digital Cook Book</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#081716" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Your digital cookbook: save family recipes, cook step by step, plan the week and get ideas from what's in your fridge."
    />

    <!-- The card shown when the link is shared (WhatsApp, Facebook, Messenger, iMessage, X…).
       Uses the live address: update it when the site moves to cook90.ro. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="C00K90" />
    <meta property="og:title" content="C00K90 — Your recipes, all in one cozy place" />
    <meta
      property="og:description"
      content="Your digital cookbook: save family recipes, cook step by step, plan the week and get ideas from what's in your fridge."
    />
    <meta property="og:url" content="https://cookbook.antdevlabs.com/" />
    <meta property="og:image" content="https://cookbook.antdevlabs.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="C00K90 – your digital cookbook" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
     <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="C00K90" />

    <!-- Applies the saved theme before the page paints, so it never flashes the wrong colors.
       Keep in sync with ThemeService. -->
    <script>
      try {
        var t = localStorage.getItem('c00k90-theme') || 'auto';
        if (t === 'auto')
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'sunny' : 'forest';
        if (t !== 'forest') document.documentElement.setAttribute('data-theme', t);
        if (t === 'sunny' || t === 'rose')
          document.querySelector('meta[name=color-scheme]').setAttribute('content', 'light');
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
