<header class="app-header">
  <div class="header-inner">
    <a class="logo-link" routerLink="/" [attr.aria-label]="'header.home' | t"><app-logo /></a>

    <label class="search-bar">
      <span class="search-icon" aria-hidden="true">🔍</span>
      <input
        type="search"
        [placeholder]="'header.search' | t"
        [attr.aria-label]="'header.search' | t"
        [value]="store.search()"
        (input)="onSearch($event)"
      />
    </label>

    <nav class="header-nav" [attr.aria-label]="'header.nav' | t">
      @for (item of navItems(); track item.path) {
        <a
          class="nav-btn"
          [class.active]="item.active"
          [attr.aria-current]="item.active ? 'page' : null"
          [routerLink]="item.link"
          >{{ item.labelKey | t }}</a
        >
      }
      <button
        type="button"
        class="btn-new"
        [attr.aria-label]="'header.newRecipe' | t"
        (click)="dialogs.openForm()"
      >
        <span class="plus-icon" aria-hidden="true">🍳</span> {{ 'header.newRecipe' | t }}
      </button>
      <app-account-menu class="account-menu" />
    </nav>
  </div>
</header>
